<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; cursor: pointer; }
    .box { margin-top: 1.5rem; padding: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .hidden { display: none; }
    .warn { background: #fff8e6; border-color: #f0c36d; }
    .error { background: #fdecea; border-color: #f5c2c7; }
    .badge { display: inline-block; padding: .15rem .5rem; background: #eef2ff; border-radius: 4px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form id="triage-form" novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" placeholder="Введите текст обращения клиента..."></textarea>
    <button id="submit-btn" type="submit">Разобрать заявку</button>
  </form>

  <div id="status-box" class="box hidden" aria-live="polite"></div>

  <div id="result-box" class="box hidden">
    <div>Тема: <span id="topic" class="badge"></span></div>
    <label for="draft" style="display:block; margin-top:.75rem;">Черновик ответа</label>
    <textarea id="draft" rows="4"></textarea>
  </div>

  <script type="module">
    const form = document.querySelector("#triage-form");
    const messageEl = document.querySelector("#message");
    const submitBtn = document.querySelector("#submit-btn");
    const statusBox = document.querySelector("#status-box");
    const resultBox = document.querySelector("#result-box");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");

    const TOPIC_LABELS = {
      delivery: "Доставка (delivery)",
      pricing: "Стоимость (pricing)",
      other: "Другое (other)",
    };

    let activeController = null;

    function clearDraft() {
      topicEl.textContent = "";
      draftEl.value = "";
      resultBox.classList.add("hidden");
    }

    function showStatus(text, type = "warn") {
      statusBox.textContent = text;
      statusBox.className = `box ${type}`;
    }

    function hideStatus() {
      statusBox.textContent = "";
      statusBox.className = "box hidden";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = messageEl.value.trim();

      if (!text) {
        clearDraft();
        showStatus("Введите текст заявки перед отправкой.", "error");
        return;
      }

      if (activeController) activeController.abort();
      activeController = new AbortController();
      submitBtn.disabled = true;
      hideStatus();

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: activeController.signal,
        });

        const data = await reply.json();

        if (!reply.ok || data.status === "invalid_input") {
          clearDraft();
          showStatus("Некорректный ввод. Проверьте текст заявки и повторите попытку.", "error");
          return;
        }

        if (data.status === "manual_review") {
          clearDraft();
          showStatus("Автоматический разбор не удался. Требуется ручной разбор заявки менеджером.", "warn");
          return;
        }

        if (data.status === "ready") {
          hideStatus();
          topicEl.textContent = TOPIC_LABELS[data.topic] || data.topic;
          draftEl.value = data.draft;
          resultBox.classList.remove("hidden");
        }
      } catch (err) {
        if (err.name === "AbortError") return;
        clearDraft();
        showStatus("Ошибка сети при обращении к серверу. Передайте заявку на ручной разбор.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
